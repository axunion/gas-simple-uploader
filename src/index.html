<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#F4F1EA">
    <title>File Upload</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        button, input {
            border-radius: 0;
            outline: none;
        }

        :root {
            --font-sans:  -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
                          "Helvetica Neue", "Helvetica", "Segoe UI Variable", "Segoe UI",
                          system-ui, "Liberation Sans", "Arial", sans-serif;
            --font-serif: ui-serif, "New York", "Iowan Old Style",
                          "Palatino Linotype", Palatino, Georgia, serif;
            --font-mono:  ui-monospace, "SF Mono", "Menlo", "Monaco",
                         "Cascadia Mono", "Consolas", "Liberation Mono", monospace;

            --bg:              #F4F1EA;
            --surface:         #FAF8F2;
            --ink:             #131310;
            --ink-muted:       #6E6B62;
            --ink-faint:       #B5B0A4;
            --hairline:        rgba(19, 19, 16, 0.12);
            --hairline-strong: rgba(19, 19, 16, 0.24);
            --accent:          #C2410C;

            --ease:    cubic-bezier(0.2, 0, 0, 1);
            --ease-io: cubic-bezier(0.65, 0, 0.35, 1);
            --dur-1:   140ms;
            --dur-2:   240ms;
            --dur-3:   420ms;
        }

        body {
            font-family: var(--font-sans);
            font-feature-settings: "kern" 1, "liga" 1, "calt" 1, "ss01" 1;
            font-variant-numeric: lining-nums;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            color: var(--ink);
            background-color: var(--bg);
            background-image: radial-gradient(
                circle at 1px 1px,
                rgba(19, 19, 16, 0.07) 1px,
                transparent 0
            );
            background-size: 24px 24px;
            min-height: 100dvh;
            padding: clamp(20px, 4vw, 56px);
            padding-bottom: calc(clamp(20px, 4vw, 56px) + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        main {
            display: flex;
            flex-direction: column;
            gap: clamp(20px, 3vw, 36px);
            max-width: 1080px;
            width: 100%;
        }

        /* ── DISPLAY TITLE ── */

        .display {
            font-family: var(--font-serif);
            font-size: clamp(32px, 8vw, 80px);
            font-weight: 600;
            letter-spacing: -0.02em;
            line-height: 0.95;
            color: var(--ink);
            white-space: nowrap;
            animation: rise 520ms 60ms var(--ease) both;
        }

        /* ── HAIRLINE RULE ── */

        .rule {
            border: 0;
            border-top: 1px solid var(--hairline);
            animation: rise 480ms 120ms var(--ease) both;
        }

        /* ── FORM ── */

        #uploadForm {
            display: flex;
            flex-direction: column;
            gap: clamp(16px, 2vw, 24px);
        }

        /* ── DROPZONE WRAP ── */

        .dropzone-wrap {
            width: min(720px, 100%);
            animation: rise 540ms 180ms var(--ease) both;
        }

        /* ── DROPZONE ── */

        .dropzone {
            position: relative;
            padding: clamp(28px, 5vw, 48px) clamp(20px, 4vw, 36px);
            min-height: clamp(160px, 24vw, 220px);
            border: 1px solid var(--hairline);
            cursor: pointer;
            transition: border-color var(--dur-2) var(--ease),
                        background-color var(--dur-2) var(--ease);
            outline: none;
        }

        .dropzone[data-state="empty"]:hover {
            border-color: var(--hairline-strong);
            background: var(--surface);
        }

        .dropzone.active {
            border-color: var(--accent);
            background: var(--surface);
        }

        .dropzone:focus-visible {
            outline: 1px solid var(--accent);
            outline-offset: 3px;
        }

        .dropzone[data-state="filled"] {
            cursor: default;
            pointer-events: none;
        }

        /* ── DROPZONE INNER STATES ── */

        .dz-empty {
            display: flex;
            align-items: center;
            gap: 20px;
            width: 100%;
        }

        .dz-filled {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            width: 100%;
        }

        .dropzone[data-state="filled"] .dz-empty { display: none; }
        .dropzone[data-state="filled"] .dz-filled { display: flex; }

        /* ── EMPTY STATE ── */

        .plus {
            font-size: 28px;
            font-weight: 300;
            line-height: 1;
            color: var(--ink);
            flex-shrink: 0;
            user-select: none;
            transition: color var(--dur-2) var(--ease),
                        transform var(--dur-2) var(--ease);
        }

        .dropzone[data-state="empty"]:hover .plus,
        .dropzone.active .plus {
            color: var(--accent);
            transform: rotate(90deg);
        }

        .dz-text {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .dz-primary {
            font-size: 15px;
            font-weight: 500;
            letter-spacing: -0.005em;
            line-height: 1.35;
            color: var(--ink);
        }

        .dz-hint {
            font-size: 13px;
            font-weight: 400;
            line-height: 1.5;
            color: var(--ink-muted);
        }

        /* ── FILLED STATE ── */

        .dz-file-meta {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }

        .filename {
            font-size: 15px;
            font-weight: 500;
            letter-spacing: -0.005em;
            line-height: 1.3;
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
        }

        .filesize {
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.04em;
            line-height: 1;
            color: var(--ink-muted);
            font-feature-settings: "tnum" 1;
            font-variant-numeric: tabular-nums lining-nums;
        }

        .remove {
            appearance: none;
            background: transparent;
            border: 0;
            font: inherit;
            font-size: 14px;
            line-height: 1;
            color: var(--ink-muted);
            cursor: pointer;
            padding: 8px;
            flex-shrink: 0;
            transition: color var(--dur-1) var(--ease);
        }

        .remove:hover { color: var(--accent); }

        .remove:focus-visible {
            color: var(--accent);
            outline: 1px solid var(--accent);
            outline-offset: 3px;
        }

        .dropzone[data-state="filled"] .remove {
            pointer-events: auto;
        }

        /* ── FILE INPUT ── */

        .file-input { display: none; }

        /* ── PROGRESS ── */

        .progress {
            position: relative;
            height: 1px;
            width: min(720px, 100%);
            visibility: hidden;
        }

        .progress.show { visibility: visible; }

        .progress-track {
            position: absolute;
            inset: 0;
            background: var(--hairline);
        }

        .progress-bar {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            width: 100%;
            transform-origin: left center;
            background: var(--accent);
        }

        .progress.show .progress-bar {
            animation: sweep 1.6s var(--ease-io) infinite;
        }

        /* ── META STRIP ── */

        .meta-strip {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.06em;
            line-height: 1;
            color: var(--ink-faint);
            text-transform: uppercase;
            font-feature-settings: "tnum" 1;
            width: min(720px, 100%);
            animation: rise 480ms 240ms var(--ease) both;
        }

        /* ── SUBMIT ROW ── */

        .submit-row {
            display: flex;
            justify-content: flex-end;
            width: min(720px, 100%);
            animation: rise 480ms 300ms var(--ease) both;
        }

        .submit {
            appearance: none;
            background: transparent;
            border: 0;
            font-family: var(--font-sans);
            font-size: 18px;
            font-weight: 500;
            letter-spacing: -0.01em;
            line-height: 1;
            color: var(--ink-muted);
            cursor: not-allowed;
            display: inline-flex;
            align-items: center;
            gap: 16px;
            padding: 8px 0;
            pointer-events: none;
            transition: color var(--dur-2) var(--ease);
        }

        .submit.show {
            pointer-events: auto;
            cursor: pointer;
            color: var(--ink);
        }

        .submit.show:hover,
        .submit.show:focus-visible {
            color: var(--accent);
        }

        .submit:focus-visible {
            outline: 1px solid var(--accent);
            outline-offset: 6px;
        }

        .submit.loading {
            color: var(--ink-muted);
            pointer-events: none;
        }

        .submit-rule {
            display: inline-block;
            width: 64px;
            height: 1px;
            background: currentColor;
            flex-shrink: 0;
            transition: width var(--dur-2) var(--ease);
        }

        .submit.show:hover .submit-rule,
        .submit.show:focus-visible .submit-rule {
            width: 96px;
        }

        .submit-arrow {
            transition: transform var(--dur-2) var(--ease),
                        opacity var(--dur-1) var(--ease);
        }

        .submit.show:hover .submit-arrow,
        .submit.show:focus-visible .submit-arrow {
            transform: translateX(4px);
        }

        .submit.loading .submit-arrow { opacity: 0; }

        /* ── MODAL OVERLAY ── */

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(19, 19, 16, 0.42);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(20px, 4vw, 56px);
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity var(--dur-2) var(--ease),
                        visibility 0s var(--dur-2);
        }

        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transition: opacity var(--dur-2) var(--ease),
                        visibility 0s 0s;
        }

        /* ── MODAL CARD ── */

        .modal-card {
            background: var(--surface);
            border: 1px solid var(--hairline);
            padding: clamp(28px, 4vw, 40px);
            width: min(420px, 100%);
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .modal-tag {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            line-height: 1.4;
            color: var(--ink);
            border: 1px solid var(--hairline-strong);
            padding: 3px 8px;
            align-self: flex-start;
        }

        .modal-overlay[data-type="error"]   .modal-tag { color: var(--accent); border-color: var(--accent); }
        .modal-overlay[data-type="warning"] .modal-tag { color: #A86B00; border-color: #A86B00; }

        .modal-message {
            font-size: 15px;
            font-weight: 400;
            line-height: 1.55;
            color: var(--ink);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
        }

        .modal-btn {
            appearance: none;
            background: transparent;
            border: 0;
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--ink-muted);
            cursor: pointer;
            padding: 4px 0;
            text-decoration: underline;
            text-underline-offset: 4px;
            transition: color var(--dur-1) var(--ease);
        }

        .modal-btn:hover { color: var(--accent); }

        .modal-btn:focus-visible {
            color: var(--accent);
            outline: 1px solid var(--accent);
            outline-offset: 3px;
        }

        /* ── KEYFRAMES ── */

        @keyframes rise {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes sweep {
            0%   { transform: translateX(-100%) scaleX(0.3); }
            50%  { transform: translateX(30%)   scaleX(0.4); }
            100% { transform: translateX(100%)  scaleX(0.2); }
        }

        /* ── REDUCED MOTION ── */

        @media (prefers-reduced-motion: reduce) {
            .display,
            .rule,
            .dropzone-wrap,
            .meta-strip,
            .submit-row {
                animation: none;
            }
            .dropzone,
            .plus,
            .dropzone[data-state="filled"] .remove,
            .remove,
            .submit,
            .submit-rule,
            .submit-arrow {
                transition: none;
            }
            .modal-overlay,
            .modal-overlay.show {
                transition: none;
            }
            .progress.show .progress-bar {
                animation: none;
                transform: none;
                opacity: 0.5;
            }
        }

    </style>
</head>
<body>
    <main>
        <h1 class="display">UPLOAD</h1>
        <hr class="rule">

        <form id="uploadForm">
            <div class="dropzone-wrap">
                <div class="dropzone" id="dropzone" data-state="empty" tabindex="0" role="button"
                     aria-label="ファイルを選択またはドラッグ＆ドロップ">

                    <div class="dz-empty">
                        <span class="plus" aria-hidden="true">＋</span>
                        <div class="dz-text">
                            <span class="dz-primary">ファイルを選択</span>
                            <span class="dz-hint">またはドラッグ＆ドロップ</span>
                        </div>
                    </div>

                    <div class="dz-filled">
                        <div class="dz-file-meta">
                            <span class="filename" id="fileName"></span>
                            <span class="filesize" id="fileSize"></span>
                        </div>
                        <button type="button" class="remove" id="removeBtn"
                                aria-label="ファイルを取り消す">✕</button>
                    </div>
                </div>
            </div>

            <input type="file" id="fileInput" class="file-input" required>

            <div class="progress" id="progress" aria-hidden="true">
                <div class="progress-track"></div>
                <div class="progress-bar"></div>
            </div>

            <div class="meta-strip">MAX 50MB</div>

            <div class="submit-row">
                <button type="submit" class="submit" id="submitBtn">
                    <span class="submit-rule" aria-hidden="true"></span>
                    <span class="submit-label">送信</span>
                    <span class="submit-arrow" aria-hidden="true">→</span>
                </button>
            </div>
        </form>
    </main>

    <div class="modal-overlay" id="modal" role="dialog" aria-modal="true"
         aria-labelledby="modalTitle" aria-describedby="modalMessage">
        <div class="modal-card">
            <span class="modal-tag" id="modalTitle"></span>
            <p class="modal-message" id="modalMessage"></p>
            <div class="modal-actions">
                <button type="button" class="modal-btn" id="modalBtn">OK</button>
            </div>
        </div>
    </div>

    <script>
        const $ = id => document.getElementById(id);
        const MAX_FILE_SIZE = 50 * 1024 * 1024;
        const ERR_UPLOAD = 'アップロードに失敗しました。時間をおいて再度お試しください';

        const el = {
            form:         $('uploadForm'),
            fileInput:    $('fileInput'),
            dropzone:     $('dropzone'),
            fileName:     $('fileName'),
            fileSize:     $('fileSize'),
            removeBtn:    $('removeBtn'),
            submitBtn:    $('submitBtn'),
            progress:     $('progress'),
            modal:        $('modal'),
            modalTitle:   $('modalTitle'),
            modalMessage: $('modalMessage'),
            modalBtn:     $('modalBtn')
        };

        const formatSize = bytes => {
            if (bytes === 0) return '0 B';
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.min(3, Math.floor(Math.log(bytes) / Math.log(1024)));
            return `${(bytes / 1024 ** i).toFixed(i ? 1 : 0)} ${sizes[i]}`;
        };

        const showFile = file => {
            if (file.size > MAX_FILE_SIZE) {
                showModal('warning', 'サイズ超過', `${formatSize(MAX_FILE_SIZE)}以下のファイルを選択してください`);
                return;
            }
            el.fileName.textContent = file.name;
            el.fileSize.textContent = formatSize(file.size);
            el.dropzone.dataset.state = 'filled';
            el.submitBtn.classList.add('show');
        };

        const reset = () => {
            el.dropzone.dataset.state = 'empty';
            el.submitBtn.classList.remove('show');
            el.progress.classList.remove('show');
            el.fileInput.value = '';
        };

        const setLoading = on => {
            el.submitBtn.disabled = on;
            el.submitBtn.classList.toggle('loading', on);
            el.removeBtn.style.display = on ? 'none' : '';
            el.progress.classList.toggle('show', on);
        };

        let dismissTimer = null;
        let lastFocus = null;
        let hideTimer = null;
        let modalRaf = 0;

        const showModal = (type, title, message) => {
            clearTimeout(dismissTimer);
            clearTimeout(hideTimer);
            cancelAnimationFrame(modalRaf);
            if (!el.modal.classList.contains('show')) lastFocus = document.activeElement;
            el.modal.dataset.type = type;
            el.modalTitle.textContent = title;
            el.modalMessage.textContent = message;
            modalRaf = requestAnimationFrame(() => {
                el.modal.classList.add('show');
                el.modalBtn.focus();
            });
            if (type === 'success') dismissTimer = setTimeout(closeModal, 4500);
        };

        const closeModal = () => {
            clearTimeout(dismissTimer);
            el.modal.classList.remove('show');
            hideTimer = setTimeout(() => lastFocus?.focus(), 240);
        };

        const upload = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = e => {
                const result = e.target.result;
                try {
                    const sep = result.slice(0, 128).indexOf(',');
                    google.script.run
                        .withSuccessHandler(resolve)
                        .withFailureHandler(reject)
                        .uploadFile(result.slice(sep + 1), file.name, file.type);
                } catch (err) {
                    reject(err);
                }
            };
            reader.onerror = () => reject(new Error('読み込み失敗'));
            reader.readAsDataURL(file);
        });

        const handleSubmit = async e => {
            e.preventDefault();
            const file = el.fileInput.files[0];
            if (!file) return showModal('warning', '未選択', 'ファイルを選択してください');

            setLoading(true);
            try {
                const res = await upload(file);
                if (res.result === 'done') {
                    showModal('success', '完了', 'アップロードが完了しました');
                    reset();
                } else {
                    showModal('error', 'エラー', ERR_UPLOAD);
                }
            } catch {
                showModal('error', 'エラー', ERR_UPLOAD);
            } finally {
                setLoading(false);
            }
        };

        el.dropzone.addEventListener('dragover', e => {
            e.preventDefault();
            if (el.dropzone.dataset.state === 'filled') return;
            el.dropzone.classList.add('active');
        });
        el.dropzone.addEventListener('dragleave', e => {
            e.preventDefault();
            el.dropzone.classList.remove('active');
        });
        el.dropzone.addEventListener('drop', e => {
            e.preventDefault();
            el.dropzone.classList.remove('active');
            if (el.dropzone.dataset.state === 'filled') return;
            if (e.dataTransfer.files[0]) {
                el.fileInput.files = e.dataTransfer.files;
                showFile(e.dataTransfer.files[0]);
            }
        });

        el.dropzone.addEventListener('click', () => {
            if (el.dropzone.dataset.state === 'empty') el.fileInput.click();
        });
        el.dropzone.addEventListener('keydown', e => {
            if ((e.key === 'Enter' || e.key === ' ') && el.dropzone.dataset.state === 'empty') {
                e.preventDefault();
                el.fileInput.click();
            }
        });
        el.fileInput.addEventListener('change', e => e.target.files[0] && showFile(e.target.files[0]));
        el.form.addEventListener('submit', handleSubmit);
        el.removeBtn.addEventListener('click', e => { e.stopPropagation(); reset(); });
        el.modalBtn.addEventListener('click', closeModal);
        el.modal.addEventListener('click', e => e.target === el.modal && closeModal());
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && el.modal.classList.contains('show')) closeModal();
        });
    </script>
</body>
</html>
