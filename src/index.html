<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#F4F1EA">
    <title>File Upload</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        button, input {
            border-radius: 0;
            outline: none;
        }

        :root {
            --font-sans:  -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
                          "Helvetica Neue", "Helvetica", "Segoe UI Variable", "Segoe UI",
                          system-ui, "Liberation Sans", "Arial", sans-serif;
            --font-serif: ui-serif, "New York", "Iowan Old Style",
                          "Palatino Linotype", Palatino, Georgia, serif;
            --font-mono:  ui-monospace, "SF Mono", "Menlo", "Monaco",
                         "Cascadia Mono", "Consolas", "Liberation Mono", monospace;

            --bg:              #F4F1EA;
            --surface:         #FAF8F2;
            --ink:             #131310;
            --ink-muted:       #6E6B62;
            --ink-faint:       #B5B0A4;
            --hairline:        rgba(19, 19, 16, 0.12);
            --hairline-strong: rgba(19, 19, 16, 0.24);
            --accent:          #C2410C;

            --ease:    cubic-bezier(0.2, 0, 0, 1);
            --ease-io: cubic-bezier(0.65, 0, 0.35, 1);
            --dur-1:   140ms;
            --dur-2:   240ms;
            --dur-3:   420ms;
        }

        body {
            font-family: var(--font-sans);
            font-feature-settings: "kern" 1, "liga" 1, "calt" 1, "ss01" 1;
            font-variant-numeric: lining-nums;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            color: var(--ink);
            background-color: var(--bg);
            background-image: radial-gradient(
                circle at 1px 1px,
                rgba(19, 19, 16, 0.07) 1px,
                transparent 0
            );
            background-size: 24px 24px;
            min-height: 100dvh;
            padding: clamp(20px, 4vw, 56px);
            padding-bottom: calc(clamp(20px, 4vw, 56px) + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        main {
            display: flex;
            flex-direction: column;
            gap: clamp(20px, 3vw, 36px);
            max-width: 1080px;
            width: 100%;
        }

        /* ── DISPLAY TITLE ── */

        .display {
            font-family: var(--font-serif);
            font-size: clamp(26px, 8.5vw, 88px);
            font-weight: 600;
            letter-spacing: -0.02em;
            line-height: 0.95;
            color: var(--ink);
            white-space: nowrap;
            animation: rise 520ms 60ms var(--ease) both;
        }

        /* ── HAIRLINE RULE ── */

        .rule {
            border: 0;
            border-top: 1px solid var(--hairline);
            animation: rise 480ms 120ms var(--ease) both;
        }

        /* ── FORM ── */

        #uploadForm {
            display: flex;
            flex-direction: column;
            gap: clamp(14px, 2vw, 22px);
        }

        /* ── DROPZONE WRAP ── */

        .dropzone-wrap {
            width: min(720px, 100%);
            animation: rise 540ms 180ms var(--ease) both;
        }

        /* ── DROPZONE ── */

        .dropzone {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: clamp(28px, 5vw, 48px) clamp(20px, 4vw, 36px);
            min-height: clamp(160px, 24vw, 220px);
            border: 1px solid var(--hairline);
            cursor: pointer;
            transition: border-color var(--dur-2) var(--ease),
                        background-color var(--dur-2) var(--ease);
            outline: none;
        }

        .dropzone:hover {
            border-color: var(--hairline-strong);
            background: var(--surface);
        }

        .dropzone.active {
            border-color: var(--accent);
            background: var(--surface);
        }

        .dropzone:focus-visible {
            outline: 1px solid var(--accent);
            outline-offset: 3px;
        }

        .plus {
            font-size: 28px;
            font-weight: 300;
            line-height: 1;
            color: var(--ink);
            flex-shrink: 0;
            user-select: none;
            transition: color var(--dur-2) var(--ease),
                        transform var(--dur-2) var(--ease);
        }

        .dropzone:hover .plus,
        .dropzone.active .plus {
            color: var(--accent);
            transform: rotate(90deg);
        }

        .dz-text {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .dz-primary {
            font-size: 15px;
            font-weight: 500;
            letter-spacing: -0.005em;
            line-height: 1.3;
            color: var(--ink);
        }

        .dz-hint {
            font-size: 13px;
            font-weight: 400;
            line-height: 1.45;
            color: var(--ink-muted);
        }

        /* ── FILE ROW ── */

        .file-row {
            display: none;
            align-items: baseline;
            gap: 24px;
            padding: 18px 0;
            border-top: 1px solid var(--hairline);
            border-bottom: 1px solid var(--hairline);
        }

        .file-row.show {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            animation: fadeIn var(--dur-2) var(--ease);
        }

        .filename {
            font-size: 15px;
            font-weight: 500;
            letter-spacing: -0.005em;
            line-height: 1.3;
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
        }

        .filesize {
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.04em;
            line-height: 1;
            color: var(--ink-muted);
            font-feature-settings: "tnum" 1;
            font-variant-numeric: tabular-nums lining-nums;
            white-space: nowrap;
        }

        .remove {
            appearance: none;
            background: transparent;
            border: 0;
            font: inherit;
            font-size: 14px;
            line-height: 1;
            color: var(--ink-muted);
            cursor: pointer;
            padding: 4px 0 4px 8px;
            transition: color var(--dur-1) var(--ease);
        }

        .remove:hover { color: var(--accent); }

        .remove:focus-visible {
            color: var(--accent);
            outline: 1px solid var(--accent);
            outline-offset: 3px;
        }

        /* ── FILE INPUT ── */

        .file-input { display: none; }

        /* ── PROGRESS ── */

        .progress {
            display: none;
            position: relative;
            height: 1px;
            width: min(720px, 100%);
        }

        .progress.show { display: block; }

        .progress-track {
            position: absolute;
            inset: 0;
            background: var(--hairline);
        }

        .progress-bar {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 30%;
            background: var(--accent);
            animation: sweep 1.6s var(--ease-io) infinite;
        }

        /* ── META STRIP ── */

        .meta-strip {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.06em;
            line-height: 1;
            color: var(--ink-faint);
            text-transform: uppercase;
            font-feature-settings: "tnum" 1;
            width: min(720px, 100%);
            animation: rise 480ms 240ms var(--ease) both;
        }

        /* ── SUBMIT ROW ── */

        .submit-row {
            display: flex;
            justify-content: flex-end;
            width: min(720px, 100%);
            animation: rise 480ms 300ms var(--ease) both;
        }

        .submit {
            appearance: none;
            background: transparent;
            border: 0;
            font-family: var(--font-sans);
            font-size: 17px;
            font-weight: 500;
            letter-spacing: -0.01em;
            line-height: 1;
            color: var(--ink-muted);
            cursor: not-allowed;
            display: inline-flex;
            align-items: center;
            gap: 16px;
            padding: 8px 0;
            pointer-events: none;
            transition: color var(--dur-2) var(--ease);
        }

        .submit.show {
            pointer-events: auto;
            cursor: pointer;
            color: var(--ink);
        }

        .submit.show:hover,
        .submit.show:focus-visible {
            color: var(--accent);
        }

        .submit:focus-visible {
            outline: 1px solid var(--accent);
            outline-offset: 6px;
        }

        .submit.loading {
            color: var(--ink-muted);
            pointer-events: none;
        }

        .submit-rule {
            display: inline-block;
            width: 56px;
            height: 1px;
            background: currentColor;
            flex-shrink: 0;
            transition: width var(--dur-2) var(--ease);
        }

        .submit.show:hover .submit-rule,
        .submit.show:focus-visible .submit-rule {
            width: 88px;
        }

        .submit-arrow {
            transition: transform var(--dur-2) var(--ease),
                        opacity var(--dur-1) var(--ease);
        }

        .submit.show:hover .submit-arrow,
        .submit.show:focus-visible .submit-arrow {
            transform: translateX(4px);
        }

        .submit.loading .submit-arrow { opacity: 0; }

        /* ── NOTICE BANNER ── */

        .notice {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: var(--ink);
            transform: translateY(-100%);
            transition: transform var(--dur-3) var(--ease);
            z-index: 100;
        }

        .notice.show { transform: translateY(0); }

        .notice-inner {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 14px clamp(20px, 4vw, 56px);
        }

        .notice-tag {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--bg);
            border: 1px solid var(--bg);
            padding: 3px 8px;
            line-height: 1.4;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .notice.error .notice-tag   { color: #FFB4B4; border-color: #FFB4B4; }
        .notice.warning .notice-tag { color: #FFD08A; border-color: #FFD08A; }

        .notice-msg {
            font-size: 14px;
            font-weight: 400;
            color: var(--bg);
            line-height: 1.45;
            flex: 1;
            min-width: 0;
        }

        .notice-close {
            appearance: none;
            background: transparent;
            border: 0;
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--bg);
            cursor: pointer;
            padding: 4px 8px;
            text-decoration: underline;
            text-underline-offset: 4px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .notice-close:hover { text-decoration-thickness: 2px; }

        .notice-close:focus-visible {
            text-decoration-thickness: 2px;
            outline: 1px solid var(--bg);
            outline-offset: 3px;
        }

        /* ── KEYFRAMES ── */

        @keyframes rise {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        @keyframes sweep {
            0%   { left: -30%; width: 30%; }
            50%  { left:  35%; width: 40%; }
            100% { left: 100%; width: 20%; }
        }

        /* ── REDUCED MOTION ── */

        @media (prefers-reduced-motion: reduce) {
            .display,
            .rule,
            .dropzone-wrap,
            .meta-strip,
            .submit-row,
            .file-row.show {
                animation: none;
            }
            .dropzone,
            .plus,
            .remove,
            .submit,
            .submit-rule,
            .submit-arrow,
            .notice {
                transition: none;
            }
            .progress-bar {
                animation: none;
                left: 0;
                width: 100%;
                opacity: 0.5;
            }
        }

    </style>
</head>
<body>
    <main>
        <h1 class="display">UPLOAD</h1>
        <hr class="rule">

        <form id="uploadForm">
            <div class="dropzone-wrap">
                <div class="dropzone" id="dropzone" tabindex="0" role="button"
                     aria-label="ファイルを選択またはドラッグ＆ドロップ">
                    <span class="plus" aria-hidden="true">＋</span>
                    <div class="dz-text">
                        <span class="dz-primary">ファイルを選択</span>
                        <span class="dz-hint">またはドラッグ＆ドロップ</span>
                    </div>
                </div>

                <div class="file-row" id="fileCard">
                    <span class="filename" id="fileName"></span>
                    <span class="filesize" id="fileSize"></span>
                    <button type="button" class="remove" id="removeBtn"
                            aria-label="ファイルを取り消す">✕</button>
                </div>
            </div>

            <input type="file" id="fileInput" class="file-input" required>

            <div class="progress" id="progress" aria-hidden="true">
                <div class="progress-track"></div>
                <div class="progress-bar"></div>
            </div>

            <div class="meta-strip">MAX 50MB</div>

            <div class="submit-row">
                <button type="submit" class="submit" id="submitBtn">
                    <span class="submit-rule" aria-hidden="true"></span>
                    <span class="submit-label">送信</span>
                    <span class="submit-arrow" aria-hidden="true">→</span>
                </button>
            </div>
        </form>
    </main>

    <aside class="notice" id="modal" role="status" aria-live="polite">
        <div class="notice-inner">
            <span class="notice-tag" id="modalTitle"></span>
            <span class="notice-msg" id="modalMessage"></span>
            <button type="button" class="notice-close" id="modalBtn"
                    aria-label="閉じる">OK</button>
        </div>
    </aside>

    <script>
        const $ = id => document.getElementById(id);
        const MAX_FILE_SIZE = 50 * 1024 * 1024;

        const el = {
            form:         $('uploadForm'),
            fileInput:    $('fileInput'),
            dropzone:     $('dropzone'),
            fileCard:     $('fileCard'),
            fileName:     $('fileName'),
            fileSize:     $('fileSize'),
            removeBtn:    $('removeBtn'),
            submitBtn:    $('submitBtn'),
            progress:     $('progress'),
            modal:        $('modal'),
            modalTitle:   $('modalTitle'),
            modalMessage: $('modalMessage'),
            modalBtn:     $('modalBtn')
        };

        const formatSize = bytes => {
            if (bytes === 0) return '0 B';
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log2(bytes) / 10);
            return `${(bytes / 1024 ** i).toFixed(i ? 1 : 0)} ${sizes[i]}`;
        };

        const showFile = file => {
            if (file.size > MAX_FILE_SIZE) {
                showModal('warning', 'サイズ超過', `${formatSize(MAX_FILE_SIZE)}以下のファイルを選択してください`);
                return;
            }
            el.fileName.textContent = file.name;
            el.fileSize.textContent = formatSize(file.size);
            el.dropzone.style.display = 'none';
            el.fileCard.classList.add('show');
            el.submitBtn.classList.add('show');
        };

        const reset = () => {
            el.dropzone.style.display = '';
            el.fileCard.classList.remove('show');
            el.submitBtn.classList.remove('show');
            el.progress.classList.remove('show');
            el.fileInput.value = '';
        };

        const setLoading = on => {
            el.submitBtn.disabled = on;
            el.submitBtn.classList.toggle('loading', on);
            el.removeBtn.style.display = on ? 'none' : '';
            el.progress.classList.toggle('show', on);
        };

        let dismissTimer = null;

        const showModal = (type, title, message) => {
            clearTimeout(dismissTimer);
            el.modal.className = `notice ${type} show`;
            el.modalTitle.textContent = title;
            el.modalMessage.textContent = message;
            if (type === 'success') dismissTimer = setTimeout(closeModal, 4500);
        };

        const closeModal = () => {
            el.modal.classList.remove('show');
        };

        const upload = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = e => {
                const result = e.target.result;
                google.script.run
                    .withSuccessHandler(resolve)
                    .withFailureHandler(reject)
                    .uploadFile(result.slice(result.indexOf(',') + 1), file.name, file.type);
            };
            reader.onerror = () => reject(new Error('読み込み失敗'));
            reader.readAsDataURL(file);
        });

        const handleSubmit = async e => {
            e.preventDefault();
            const file = el.fileInput.files[0];
            if (!file) return showModal('warning', '未選択', 'ファイルを選択してください');

            setLoading(true);
            try {
                const res = await upload(file);
                if (res.result === 'done') {
                    showModal('success', '完了', 'アップロードが完了しました');
                    reset();
                } else {
                    showModal('error', '失敗', 'アップロードに失敗しました');
                }
            } catch (err) {
                showModal('error', 'エラー', err.message || 'エラーが発生しました');
            } finally {
                setLoading(false);
            }
        };

        ['dragover', 'dragleave', 'drop'].forEach(evtType => {
            el.dropzone.addEventListener(evtType, e => {
                e.preventDefault();
                el.dropzone.classList.remove('active');
                if (e.type === 'dragover') el.dropzone.classList.add('active');
                else if (e.type === 'drop' && e.dataTransfer.files[0]) {
                    el.fileInput.files = e.dataTransfer.files;
                    showFile(e.dataTransfer.files[0]);
                }
            });
        });

        el.dropzone.addEventListener('click', () => el.fileInput.click());
        el.dropzone.addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                el.fileInput.click();
            }
        });
        el.fileInput.addEventListener('change', e => e.target.files[0] && showFile(e.target.files[0]));
        el.form.addEventListener('submit', handleSubmit);
        el.removeBtn.addEventListener('click', reset);
        el.modalBtn.addEventListener('click', closeModal);
        el.modal.addEventListener('click', e => e.target === el.modal && closeModal());
    </script>
</body>
</html>
