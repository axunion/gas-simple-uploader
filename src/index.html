<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#667eea">
    <title>File Upload</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            padding-bottom: calc(1.5rem + env(safe-area-inset-bottom));
        }

        .card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 2rem;
            width: 100%;
            max-width: 380px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .title {
            font-size: 1.375rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 1.5rem;
            letter-spacing: -0.025em;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .dropzone {
            border: 2px dashed rgba(255, 255, 255, 0.4);
            border-radius: 16px;
            padding: 2.5rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(255, 255, 255, 0.1);
        }

        .dropzone:hover, .dropzone.active {
            border-color: rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.2);
        }

        .dropzone-icon {
            width: 52px;
            height: 52px;
            margin: 0 auto 1rem;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .dropzone-icon svg {
            width: 26px;
            height: 26px;
            stroke: #fff;
            stroke-width: 2;
            fill: none;
        }

        .dropzone-text {
            font-size: 0.9375rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 0.25rem;
        }

        .dropzone-hint {
            font-size: 0.8125rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .file-card {
            display: none;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 1rem;
            gap: 0.875rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .file-card.show {
            display: flex;
            align-items: center;
            animation: fadeIn 0.25s ease;
        }

        .file-card-icon {
            width: 42px;
            height: 42px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .file-card-icon svg {
            width: 20px;
            height: 20px;
            stroke: #fff;
            stroke-width: 2;
            fill: none;
        }

        .file-card-info {
            flex: 1;
            min-width: 0;
        }

        .file-card-name {
            font-size: 0.875rem;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-card-size {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 2px;
        }

        .file-card-remove {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
        }

        .file-card-remove:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .file-card-remove svg {
            width: 18px;
            height: 18px;
            stroke: rgba(255, 255, 255, 0.8);
            stroke-width: 2;
        }

        .progress {
            margin-top: 0.75rem;
            display: none;
        }

        .progress.show {
            display: block;
        }

        .progress-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            width: 0;
            animation: loading 1.8s ease-in-out infinite;
        }

        .btn {
            display: none;
            width: 100%;
            padding: 0.9375rem;
            border: none;
            border-radius: 14px;
            font-size: 0.9375rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 1rem;
        }

        .btn.show {
            display: block;
        }

        .btn-primary {
            background: rgba(255, 255, 255, 0.9);
            color: #764ba2;
            position: relative;
        }

        .btn-primary:hover:not(:disabled) {
            background: #fff;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-primary.loading {
            pointer-events: none;
        }

        .btn-primary.loading .btn-label {
            visibility: hidden;
        }

        .btn-primary.loading::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            top: 50%;
            left: 50%;
            margin: -10px 0 0 -10px;
            border: 2px solid rgba(118, 75, 162, 0.3);
            border-top-color: #764ba2;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            z-index: 100;
        }

        .modal-overlay.show {
            display: flex;
            animation: fadeIn 0.2s ease;
        }

        .modal {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 2rem;
            width: 100%;
            max-width: 300px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            animation: modalIn 0.25s cubic-bezier(0.34, 1.4, 0.64, 1);
        }

        .modal-icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            margin: 0 auto 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-icon.success { background: linear-gradient(135deg, #d1fae5, #a7f3d0); }
        .modal-icon.error { background: linear-gradient(135deg, #fee2e2, #fecaca); }
        .modal-icon.warning { background: linear-gradient(135deg, #fef3c7, #fde68a); }

        .modal-icon svg {
            width: 28px;
            height: 28px;
            stroke-width: 2.5;
            fill: none;
        }

        .modal-icon.success svg { stroke: #059669; }
        .modal-icon.error svg { stroke: #dc2626; }
        .modal-icon.warning svg { stroke: #d97706; }

        .modal-title {
            font-size: 1.125rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 0.375rem;
        }

        .modal-message {
            font-size: 0.875rem;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }

        .modal-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 12px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .file-input { display: none; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.92) translateY(8px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes loading {
            0% { width: 0; margin-left: 0; }
            50% { width: 70%; margin-left: 15%; }
            100% { width: 0; margin-left: 100%; }
        }

        @media (max-width: 400px) {
            body { padding: 1rem; }
            .card { padding: 1.5rem; border-radius: 16px; }
            .dropzone { padding: 2rem 1rem; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1 class="title">ファイルをアップロード</h1>

        <form id="uploadForm">
            <div class="dropzone" id="dropzone">
                <div class="dropzone-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                </div>
                <div class="dropzone-text">ファイルを選択</div>
                <div class="dropzone-hint">またはドラッグ&ドロップ</div>
            </div>

            <input type="file" id="fileInput" class="file-input" required>

            <div class="file-card" id="fileCard">
                <div class="file-card-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                    </svg>
                </div>
                <div class="file-card-info">
                    <div class="file-card-name" id="fileName"></div>
                    <div class="file-card-size" id="fileSize"></div>
                </div>
                <button type="button" class="file-card-remove" id="removeBtn">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>

            <div class="progress" id="progress">
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" id="submitBtn">
                <span class="btn-label">アップロード</span>
            </button>
        </form>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-icon" id="modalIcon">
                <svg id="modalIconSvg" viewBox="0 0 24 24" aria-hidden="true"></svg>
            </div>
            <div class="modal-title" id="modalTitle"></div>
            <div class="modal-message" id="modalMessage"></div>
            <button type="button" class="modal-btn" id="modalBtn">OK</button>
        </div>
    </div>

    <script>
        const $ = id => document.getElementById(id);
        const MAX_FILE_SIZE = 50 * 1024 * 1024;

        const el = {
            form: $('uploadForm'),
            fileInput: $('fileInput'),
            dropzone: $('dropzone'),
            fileCard: $('fileCard'),
            fileName: $('fileName'),
            fileSize: $('fileSize'),
            removeBtn: $('removeBtn'),
            submitBtn: $('submitBtn'),
            progress: $('progress'),
            modal: $('modal'),
            modalIcon: $('modalIcon'),
            modalIconSvg: $('modalIconSvg'),
            modalTitle: $('modalTitle'),
            modalMessage: $('modalMessage'),
            modalBtn: $('modalBtn')
        };

        const icons = {
            success: '<polyline points="20 6 9 17 4 12"/>',
            error: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
            warning: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>'
        };

        const formatSize = bytes => {
            if (bytes === 0) return '0 B';
            const k = 1024, sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return `${(bytes / k ** i).toFixed(i ? 1 : 0)} ${sizes[i]}`;
        };

        const showFile = file => {
            if (file.size > MAX_FILE_SIZE) {
                showModal('warning', 'サイズ超過', `${formatSize(MAX_FILE_SIZE)}以下のファイルを選択してください`);
                return;
            }
            el.fileName.textContent = file.name;
            el.fileSize.textContent = formatSize(file.size);
            el.dropzone.style.display = 'none';
            el.fileCard.classList.add('show');
            el.submitBtn.classList.add('show');
        };

        const reset = () => {
            el.dropzone.style.display = '';
            el.fileCard.classList.remove('show');
            el.submitBtn.classList.remove('show');
            el.progress.classList.remove('show');
            el.fileInput.value = '';
        };

        const setLoading = on => {
            el.submitBtn.disabled = on;
            el.submitBtn.classList.toggle('loading', on);
            el.removeBtn.style.display = on ? 'none' : '';
            el.progress.classList.toggle('show', on);
        };

        const showModal = (type, title, message) => {
            el.modalIcon.className = `modal-icon ${type}`;
            el.modalIconSvg.innerHTML = icons[type];
            el.modalTitle.textContent = title;
            el.modalMessage.textContent = message;
            el.modal.classList.add('show');
        };

        const closeModal = () => el.modal.classList.remove('show');

        const upload = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = e => {
                google.script.run
                    .withSuccessHandler(resolve)
                    .withFailureHandler(reject)
                    .uploadFile(e.target.result.split(',')[1], file.name, file.type);
            };
            reader.onerror = () => reject(new Error('読み込み失敗'));
            reader.readAsDataURL(file);
        });

        const handleSubmit = async e => {
            e.preventDefault();
            const file = el.fileInput.files[0];
            if (!file) return showModal('warning', '未選択', 'ファイルを選択してください');

            setLoading(true);
            try {
                const res = await upload(file);
                if (res.result === 'done') {
                    showModal('success', '完了', 'アップロードが完了しました');
                    reset();
                } else {
                    showModal('error', '失敗', 'アップロードに失敗しました');
                }
            } catch (err) {
                showModal('error', 'エラー', err.message || 'エラーが発生しました');
            } finally {
                setLoading(false);
            }
        };

        ['dragover', 'dragleave', 'drop'].forEach(type => {
            el.dropzone.addEventListener(type, e => {
                e.preventDefault();
                if (type === 'dragover') el.dropzone.classList.add('active');
                else {
                    el.dropzone.classList.remove('active');
                    if (type === 'drop' && e.dataTransfer.files[0]) {
                        el.fileInput.files = e.dataTransfer.files;
                        showFile(e.dataTransfer.files[0]);
                    }
                }
            });
        });

        el.dropzone.addEventListener('click', () => el.fileInput.click());
        el.fileInput.addEventListener('change', e => e.target.files[0] && showFile(e.target.files[0]));
        el.form.addEventListener('submit', handleSubmit);
        el.removeBtn.addEventListener('click', reset);
        el.modalBtn.addEventListener('click', closeModal);
        el.modal.addEventListener('click', e => e.target === el.modal && closeModal());
    </script>
</body>
</html>
