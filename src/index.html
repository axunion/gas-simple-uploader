<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M20 35 L35 35 L40 25 L80 25 L80 75 L20 75 Z' fill='%23667eea' stroke='%23667eea' stroke-width='2' stroke-linejoin='round'/><path d='M20 35 L80 35' stroke='%23667eea' stroke-width='1'/></svg>">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #8b9dc3 0%, #9bb5d1 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 1.25rem;
            padding: 1.5rem;
            box-shadow: 0 1.25rem 2.5rem rgba(0, 0, 0, 0.1);
            max-width: 32rem;
            width: 90%;
            text-align: center;
        }

        h1 {
            font-size: 1.75rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin-bottom: 1rem;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .upload-area {
            border: 2px dashed #ddd;
            border-radius: 1.25rem;
            padding: 2rem 1rem;
            background: rgba(249, 250, 251, 0.8);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .upload-area:hover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }

        .upload-area.dragover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
            transform: scale(1.02);
        }

        .file-input {
            display: none;
        }

        .upload-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: #667eea;
        }

        .upload-text {
            color: #666;
        }

        .upload-hint {
            font-size: 0.75rem;
            color: #999;
            margin-top: 0.5rem;
        }

        .selected-file {
            background: rgba(102, 126, 234, 0.1);
            padding: 2rem 1rem;
            border-radius: 0.5rem;
            display: none;
            text-align: center;
        }

        .file-name {
            font-weight: 600;
            color: #333;
        }

        .file-size {
            color: #666;
            font-size: 0.75rem;
            margin-top: 0.25rem;
        }

        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
            width: 100%;
            display: none;
        }

        .btn.show {
            display: block;
        }

        .btn:hover {
            box-shadow: 0 0.625rem 1.25rem rgba(102, 126, 234, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn.loading {
            position: relative;
            color: transparent;
        }

        .btn.loading::after {
            content: '';
            position: absolute;
            width: 1.25rem;
            height: 1.25rem;
            top: 50%;
            left: 50%;
            margin-left: -0.625rem;
            margin-top: -0.625rem;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .dialog {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .dialog.show {
            display: flex;
        }

        .dialog-content {
            background: white;
            border-radius: 1rem;
            padding: 1.5rem;
            max-width: 24rem;
            width: 85%;
            text-align: center;
            box-shadow: 0 1.25rem 2.5rem rgba(0, 0, 0, 0.2);
        }

        .dialog-title {
            font-size: 1.125rem;
            margin-bottom: 0.75rem;
            color: #333;
        }

        .dialog-message {
            color: #666;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .dialog-close {
            background: #f1f3f4;
            color: #333;
            border: none;
            padding: 0.625rem 1.5rem;
            border-radius: 1.5rem;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .dialog-close:hover {
            background: #e8eaed;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📁 Upload</h1>

        <form id="uploadForm">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">☁️</div>
                <div class="upload-text">クリックしてファイルを選択</div>
                <div class="upload-hint">またはファイルをドラッグ&ドロップ</div>
            </div>

            <input type="file" id="fileInput" name="file" class="file-input" required>

            <div class="selected-file" id="selectedFile">
                <div class="file-name" id="fileName"></div>
                <div class="file-size" id="fileSize"></div>
            </div>

            <button type="submit" class="btn" id="uploadBtn">送信</button>
        </form>
    </div>

    <div class="dialog" id="resultDialog">
        <div class="dialog-content">
            <div class="dialog-title" id="dialogTitle">結果</div>
            <div class="dialog-message" id="dialogMessage"></div>
            <button class="dialog-close" id="dialogCloseBtn">閉じる</button>
        </div>
    </div>

    <script>
        const elements = {
            form: document.getElementById('uploadForm'),
            fileInput: document.getElementById('fileInput'),
            uploadArea: document.getElementById('uploadArea'),
            selectedFile: document.getElementById('selectedFile'),
            fileName: document.getElementById('fileName'),
            fileSize: document.getElementById('fileSize'),
            submitButton: document.getElementById('uploadBtn'),
            dialog: document.getElementById('resultDialog'),
            dialogTitle: document.getElementById('dialogTitle'),
            dialogMessage: document.getElementById('dialogMessage'),
            dialogCloseBtn: document.getElementById('dialogCloseBtn')
        };

        const formatFileSize = (bytes) => {
            if (bytes < 1024) return `${bytes} B`;
            if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
            return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
        };

        const displaySelectedFile = (file) => {
            elements.fileName.textContent = file.name;
            elements.fileSize.textContent = formatFileSize(file.size);
            elements.selectedFile.style.display = 'block';
            elements.uploadArea.style.display = 'none';
            elements.submitButton.classList.add('show');
        };

        const resetFileDisplay = () => {
            elements.selectedFile.style.display = 'none';
            elements.uploadArea.style.display = 'block';
            elements.fileInput.value = '';
            elements.submitButton.classList.remove('show');
        };

        const setButtonLoading = (loading) => {
            elements.submitButton.disabled = loading;
            elements.submitButton.classList.toggle('loading', loading);
        };

        const showDialog = (title, message) => {
            elements.dialogTitle.textContent = title;
            elements.dialogMessage.textContent = message;
            elements.dialog.classList.add('show');
        };

        const closeDialog = () => {
            elements.dialog.classList.remove('show');
        };

        const uploadFileToServer = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();

                reader.onload = (e) => {
                    const base64Data = e.target.result.split(',')[1];

                    google.script.run
                        .withSuccessHandler(resolve)
                        .withFailureHandler(reject)
                        .uploadFile(base64Data, file.name, file.type);
                };

                reader.onerror = () => reject(new Error('ファイルの読み込みに失敗しました'));
                reader.readAsDataURL(file);
            });
        };

        const handleSubmit = async (e) => {
            e.preventDefault();

            const file = elements.fileInput.files[0];
            if (!file) {
                showDialog('エラー', 'ファイルを選択してください');
                return;
            }

            setButtonLoading(true);

            try {
                const result = await uploadFileToServer(file);

                if (result.result === 'done') {
                    showDialog('成功', 'ファイルをアップロードしました');
                    resetFileDisplay();
                } else {
                    showDialog('エラー', 'アップロードに失敗しました');
                }
            } catch (error) {
                showDialog('エラー', `アップロード中にエラーが発生しました: ${error.message}`);
            } finally {
                setButtonLoading(false);
            }
        };


        elements.uploadArea.addEventListener('click', () => elements.fileInput.click());

        ['dragover', 'dragleave', 'drop'].forEach(eventName => {
            elements.uploadArea.addEventListener(eventName, (e) => {
                e.preventDefault();
                elements.uploadArea.classList.toggle('dragover', eventName === 'dragover');

                if (eventName === 'drop' && e.dataTransfer.files.length > 0) {
                    elements.fileInput.files = e.dataTransfer.files;
                    displaySelectedFile(e.dataTransfer.files[0]);
                }
            });
        });

        elements.fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                displaySelectedFile(e.target.files[0]);
            }
        });

        elements.form.addEventListener('submit', handleSubmit);

        elements.dialogCloseBtn.addEventListener('click', closeDialog);

        elements.dialog.addEventListener('click', (e) => {
            if (e.target === elements.dialog) closeDialog();
        });
    </script>
</body>
</html>
