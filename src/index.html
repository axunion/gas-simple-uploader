<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M20 35 L35 35 L40 25 L80 25 L80 75 L20 75 Z' fill='%23667eea' stroke='%23667eea' stroke-width='2' stroke-linejoin='round'/><path d='M20 35 L80 35' stroke='%23667eea' stroke-width='1'/></svg>">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg,
                rgba(120, 119, 198, 0.85) 0%,
                rgba(138, 180, 248, 0.8) 50%,
                rgba(255, 154, 158, 0.75) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #1d1d1f;
            position: relative;
        }

        header, main {
            position: relative;
            z-index: 1;
        }

        header {
            padding: 2rem 0 0;
            text-align: center;
        }

        header h1 {
            font-size: 1.5rem;
            color: #ffffff;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1rem 9rem;
        }

        .container {
            background: rgba(255, 255, 255, 0.85);
            border-radius: 18px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08),
                        0 1px 2px rgba(0, 0, 0, 0.06);
            max-width: 28rem;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .upload-area {
            border: 2px dashed #c7c7cc;
            border-radius: 12px;
            padding: 3rem 1.5rem;
            background: rgba(248, 248, 248, 0.5);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .upload-area:hover {
            border-color: #007aff;
            background: rgba(0, 122, 255, 0.04);
        }

        .upload-area.dragover {
            border-color: #007aff;
            background: rgba(0, 122, 255, 0.08);
            transform: scale(1.01);
        }

        .upload-icon {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .upload-text {
            color: #1d1d1f;
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }

        .upload-hint {
            font-size: 0.875rem;
            color: #86868b;
        }

        .selected-file {
            background: rgba(0, 122, 255, 0.08);
            padding: 2rem 1.5rem;
            border-radius: 12px;
            display: none;
        }

        .file-name {
            font-weight: 500;
            color: #1d1d1f;
            font-size: 1rem;
            word-break: break-word;
        }

        .file-size {
            color: #86868b;
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }

        .btn {
            background: #007aff;
            color: #ffffff;
            border: none;
            margin-top: 1rem;
            padding: 0.875rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            display: none;
        }

        .btn.show {
            display: block;
        }

        .btn:hover:not(:disabled) {
            background: #0051d5;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
        }

        .btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn.loading {
            position: relative;
            color: transparent;
        }

        .btn.loading::after {
            content: '';
            position: absolute;
            width: 1.25rem;
            height: 1.25rem;
            top: 50%;
            left: 50%;
            margin: -0.625rem 0 0 -0.625rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s linear infinite;
        }

        .dialog {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.2s ease;
        }

        .dialog.show {
            display: flex;
        }

        .dialog-content {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 14px;
            padding: 2rem;
            max-width: 22rem;
            width: 88%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: scaleIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .dialog-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: #1d1d1f;
            letter-spacing: -0.02em;
        }

        .dialog-message {
            color: #1d1d1f;
            font-size: 0.9375rem;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .dialog-close {
            background: #007aff;
            color: #ffffff;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .dialog-close:hover {
            background: #0051d5;
            transform: translateY(-1px);
        }

        .dialog-close:active {
            transform: translateY(0);
        }

        .file-input {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>File Upload</h1>
    </header>

    <main>
        <div class="container">
            <form id="uploadForm">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📁</div>
                    <div class="upload-text">ファイルを選択</div>
                    <div class="upload-hint">クリックまたはドラッグ&ドロップ</div>
                </div>

                <input type="file" id="fileInput" class="file-input" required>

                <div class="selected-file" id="selectedFile">
                    <div class="file-name" id="fileName"></div>
                    <div class="file-size" id="fileSize"></div>
                </div>

                <button type="submit" class="btn" id="uploadBtn">アップロード</button>
            </form>
        </div>
    </main>

    <div class="dialog" id="resultDialog">
        <div class="dialog-content">
            <div class="dialog-title" id="dialogTitle"></div>
            <div class="dialog-message" id="dialogMessage"></div>
            <button class="dialog-close" id="dialogCloseBtn">OK</button>
        </div>
    </div>

    <script>
        const $ = (id) => document.getElementById(id);

        const elements = {
            form: $('uploadForm'),
            fileInput: $('fileInput'),
            uploadArea: $('uploadArea'),
            selectedFile: $('selectedFile'),
            fileName: $('fileName'),
            fileSize: $('fileSize'),
            submitButton: $('uploadBtn'),
            dialog: $('resultDialog'),
            dialogTitle: $('dialogTitle'),
            dialogMessage: $('dialogMessage'),
            dialogCloseBtn: $('dialogCloseBtn')
        };

        const formatFileSize = (bytes) => {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return `${(bytes / Math.pow(k, i)).toFixed(1)} ${sizes[i]}`;
        };

        const displaySelectedFile = (file) => {
            elements.fileName.textContent = file.name;
            elements.fileSize.textContent = formatFileSize(file.size);
            elements.selectedFile.style.display = 'block';
            elements.uploadArea.style.display = 'none';
            elements.submitButton.classList.add('show');
        };

        const resetFileDisplay = () => {
            elements.selectedFile.style.display = 'none';
            elements.uploadArea.style.display = 'block';
            elements.fileInput.value = '';
            elements.submitButton.classList.remove('show');
        };

        const setLoading = (loading) => {
            elements.submitButton.disabled = loading;
            elements.submitButton.classList.toggle('loading', loading);
        };

        const showDialog = (title, message) => {
            elements.dialogTitle.textContent = title;
            elements.dialogMessage.textContent = message;
            elements.dialog.classList.add('show');
        };

        const closeDialog = () => {
            elements.dialog.classList.remove('show');
        };

        const uploadFile = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const base64Data = e.target.result.split(',')[1];
                    google.script.run
                        .withSuccessHandler(resolve)
                        .withFailureHandler(reject)
                        .uploadFile(base64Data, file.name, file.type);
                };
                reader.onerror = () => reject(new Error('ファイルの読み込みに失敗しました'));
                reader.readAsDataURL(file);
            });
        };

        const handleSubmit = async (e) => {
            e.preventDefault();
            const file = elements.fileInput.files[0];

            if (!file) {
                showDialog('エラー', 'ファイルを選択してください');
                return;
            }

            setLoading(true);

            try {
                const result = await uploadFile(file);
                if (result.result === 'done') {
                    showDialog('完了', 'ファイルのアップロードに成功しました');
                    resetFileDisplay();
                } else {
                    showDialog('エラー', 'アップロードに失敗しました');
                }
            } catch (error) {
                showDialog('エラー', error.message || 'アップロード中にエラーが発生しました');
            } finally {
                setLoading(false);
            }
        };

        // イベントリスナー
        elements.uploadArea.addEventListener('click', () => elements.fileInput.click());

        elements.fileInput.addEventListener('change', (e) => {
            if (e.target.files[0]) displaySelectedFile(e.target.files[0]);
        });

        ['dragover', 'dragleave', 'drop'].forEach(type => {
            elements.uploadArea.addEventListener(type, (e) => {
                e.preventDefault();
                e.stopPropagation();

                if (type === 'dragover') {
                    elements.uploadArea.classList.add('dragover');
                } else {
                    elements.uploadArea.classList.remove('dragover');
                    if (type === 'drop' && e.dataTransfer.files[0]) {
                        elements.fileInput.files = e.dataTransfer.files;
                        displaySelectedFile(e.dataTransfer.files[0]);
                    }
                }
            });
        });

        elements.form.addEventListener('submit', handleSubmit);
        elements.dialogCloseBtn.addEventListener('click', closeDialog);
        elements.dialog.addEventListener('click', (e) => {
            if (e.target === elements.dialog) closeDialog();
        });
    </script>
</body>
</html>
