<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M20 35 L35 35 L40 25 L80 25 L80 75 L20 75 Z' fill='%23667eea' stroke='%23667eea' stroke-width='2' stroke-linejoin='round'/><path d='M20 35 L80 35' stroke='%23667eea' stroke-width='1'/></svg>">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #8b9dc3 0%, #9bb5d1 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 1.25rem;
            padding: 2rem;
            box-shadow: 0 1.25rem 2.5rem rgba(0, 0, 0, 0.1);
            max-width: 25rem;
            width: 90%;
            text-align: center;
        }

        h1 {
            font-size: 1.75rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin-bottom: 1.5rem;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .upload-area {
            border: 2px dashed #ddd;
            border-radius: 1.25rem;
            padding: 2rem 1rem;
            background: rgba(249, 250, 251, 0.8);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .upload-area:hover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }

        .upload-area.dragover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
            transform: scale(1.02);
        }

        .file-input {
            display: none;
        }

        .upload-icon {
            font-size: 2rem;
            margin-bottom: 0.625rem;
            color: #667eea;
        }

        .upload-text {
            font-size: 0.875rem;
            color: #666;
            margin-bottom: 0.5rem;
        }

        .upload-hint {
            font-size: 0.75rem;
            color: #999;
        }

        .selected-file {
            background: rgba(102, 126, 234, 0.2);
            padding: 2rem 1rem;
            border-radius: 0.625rem;
            display: none;
        }

        .file-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.625rem;
        }

        .file-name {
            font-weight: 600;
            color: #333;
            font-size: 0.875rem;
        }

        .file-size {
            color: #666;
            font-size: 0.75rem;
        }

        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 1.25rem;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-0.125rem);
            box-shadow: 0 0.625rem 1.25rem rgba(102, 126, 234, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn.loading {
            position: relative;
            color: transparent;
        }

        .btn.loading::after {
            content: '';
            position: absolute;
            width: 1.25rem;
            height: 1.25rem;
            top: 50%;
            left: 50%;
            margin-left: -0.625rem;
            margin-top: -0.625rem;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .dialog {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .dialog.show {
            display: flex;
        }

        .dialog-content {
            background: white;
            border-radius: 0.9375rem;
            padding: 1.5rem;
            max-width: 22rem;
            width: 85%;
            text-align: center;
            box-shadow: 0 1.25rem 2.5rem rgba(0, 0, 0, 0.2);
        }

        .dialog-title {
            font-size: 1.125rem;
            margin-bottom: 0.75rem;
            color: #333;
        }

        .dialog-message {
            color: #666;
            margin-bottom: 1.5rem;
            line-height: 1.5;
            font-size: 0.875rem;
        }

        .dialog-close {
            background: #f1f3f4;
            color: #333;
            border: none;
            padding: 0.625rem 1.5rem;
            border-radius: 1.5625rem;
            cursor: pointer;
            transition: background 0.3s ease;
            font-size: 0.875rem;
        }

        .dialog-close:hover {
            background: #e8eaed;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📁 File Upload</h1>

        <form id="uploadForm">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">☁️</div>
                <div class="upload-text">クリックしてファイルを選択</div>
                <div class="upload-hint">またはファイルをドラッグ&ドロップ</div>
            </div>

            <input type="file" id="fileInput" name="file" class="file-input" required>

            <div class="selected-file" id="selectedFile">
                <div class="file-info">
                    <div>
                        <div class="file-name" id="fileName"></div>
                        <div class="file-size" id="fileSize"></div>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn" id="uploadBtn">アップロード</button>
        </form>
    </div>

    <div class="dialog" id="resultDialog">
        <div class="dialog-content">
            <div class="dialog-title" id="dialogTitle">結果</div>
            <div class="dialog-message" id="dialogMessage"></div>
            <button class="dialog-close" onclick="closeDialog()">閉じる</button>
        </div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const dialog = document.getElementById('resultDialog');
        const dialogTitle = document.getElementById('dialogTitle');
        const dialogMessage = document.getElementById('dialogMessage');
        const submitButton = document.getElementById('uploadBtn');
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const selectedFile = document.getElementById('selectedFile');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');

        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');

            const files = e.dataTransfer.files;
            if (files.length > 0) {
                fileInput.files = files;
                displaySelectedFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            const files = e.target.files;
            if (files.length > 0) {
                displaySelectedFile(files[0]);
            }
        });

        function displaySelectedFile(file) {
            fileName.textContent = file.name;
            fileSize.textContent = formatFileSize(file.size);
            selectedFile.style.display = 'block';
            uploadArea.style.display = 'none';
        }

        function resetFileDisplay() {
            selectedFile.style.display = 'none';
            uploadArea.style.display = 'block';
            fileInput.value = '';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const files = fileInput.files;

            if (files.length === 0) {
                showDialog('❌ エラー', 'ファイルを選択してください');
                return;
            }

            submitButton.disabled = true;
            submitButton.classList.add('loading');

            try {
                const formData = new FormData(form);
                const response = await fetch(window.location.href, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.result === 'done') {
                    showDialog('✅ 成功', 'ファイルをアップロードしました');
                    resetFileDisplay();
                } else {
                    showDialog('❌ エラー', result.error || 'アップロードに失敗しました');
                }
            } catch (error) {
                showDialog('❌ エラー', 'アップロード中にエラーが発生しました: ' + error.message);
            } finally {
                submitButton.disabled = false;
                submitButton.classList.remove('loading');
            }
        });

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function showDialog(title, message) {
            dialogTitle.textContent = title;
            dialogMessage.textContent = message;
            dialog.classList.add('show');
        }

        function closeDialog() {
            dialog.classList.remove('show');
        }

        dialog.addEventListener('click', (e) => {
            if (e.target === dialog) {
                closeDialog();
            }
        });
    </script>
</body>
</html>
